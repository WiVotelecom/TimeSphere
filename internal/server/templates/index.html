<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - Time Monitoring Dashboard</title>
    <style>
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-card: #0f3460;
            --text-primary: #eee;
            --text-secondary: #aaa;
            --accent: #e94560;
            --success: #4ade80;
            --warning: #fbbf24;
            --danger: #ef4444;
            --border: #333;
        }

        [data-theme="light"] {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: #666;
            --accent: #e94560;
            --border: #ddd;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .header {
            background: var(--bg-secondary);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .header h1 { font-size: 1.5rem; }
        .header .version { color: var(--text-secondary); font-size: 0.875rem; }

        .theme-toggle {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .clock-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .card {
            background: var(--bg-card);
            border-radius: 8px;
            padding: 1.5rem;
            border: 1px solid var(--border);
        }

        .card h2 {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .analog-clock {
            width: 200px;
            height: 200px;
            margin: 0 auto;
            position: relative;
        }

        .clock-face {
            width: 100%;
            height: 100%;
            border: 3px solid var(--accent);
            border-radius: 50%;
            position: relative;
        }

        .clock-hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            background: var(--text-primary);
            border-radius: 2px;
        }

        .hour-hand {
            width: 4px;
            height: 50px;
            margin-left: -2px;
        }

        .minute-hand {
            width: 3px;
            height: 70px;
            margin-left: -1.5px;
        }

        .second-hand {
            width: 2px;
            height: 80px;
            margin-left: -1px;
            background: var(--accent);
        }

        .clock-center {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            background: var(--accent);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .digital-time {
            font-size: 2.5rem;
            font-weight: 300;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        .time-details {
            margin-top: 1rem;
            text-align: center;
            color: var(--text-secondary);
        }

        .time-details p { margin: 0.25rem 0; }

        .servers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1rem;
        }

        .server-card {
            background: var(--bg-secondary);
            border-radius: 6px;
            padding: 1rem;
            border-left: 4px solid var(--success);
        }

        .server-card.unreachable {
            border-left-color: var(--danger);
        }

        .server-card.warning {
            border-left-color: var(--warning);
        }

        .server-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .server-name { font-weight: 600; }
        .server-status { 
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            border-radius: 3px;
            background: var(--success);
            color: #000;
        }

        .server-status.offline { background: var(--danger); color: #fff; }
        .server-status.warning { background: var(--warning); color: #000; }

        .server-metrics {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
            font-size: 0.875rem;
        }

        .metric { color: var(--text-secondary); }
        .metric-value { color: var(--text-primary); font-weight: 500; }

        .client-time-check {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid var(--border);
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 0.5rem;
        }

        .status-green { background: var(--success); }
        .status-yellow { background: var(--warning); }
        .status-orange { background: #f97316; }
        .status-red { background: var(--danger); }

        @media (max-width: 768px) {
            .container { padding: 1rem; }
            .clock-section { grid-template-columns: 1fr; }
            .servers-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body data-theme="{{if .DarkMode}}dark{{else}}light{{end}}">
    <header class="header">
        <div>
            <h1>{{.Title}}</h1>
            <span class="version">v{{.Version}}</span>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()">Toggle Theme</button>
    </header>

    <main class="container">
        <section class="clock-section">
            <div class="card">
                <h2>Analog Clock (UTC)</h2>
                <div class="analog-clock">
                    <div class="clock-face">
                        <div class="clock-hand hour-hand" id="hourHand"></div>
                        <div class="clock-hand minute-hand" id="minuteHand"></div>
                        <div class="clock-hand second-hand" id="secondHand"></div>
                        <div class="clock-center"></div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>Digital Time</h2>
                <div class="digital-time" id="digitalTime">--:--:--</div>
                <div class="time-details">
                    <p id="utcTime">UTC: --</p>
                    <p id="localTime">Local: --</p>
                    <p id="epochTime">Epoch: --</p>
                </div>
            </div>

            <div class="card client-time-check">
                <h2>Client Time Check</h2>
                <div id="clientTimeStatus">
                    <p><span class="status-indicator status-green" id="syncIndicator"></span>
                       <span id="syncStatus">Checking...</span></p>
                    <p class="metric">Offset: <span class="metric-value" id="timeOffset">--</span></p>
                    <p class="metric">RTT: <span class="metric-value" id="rttValue">--</span></p>
                    <p class="metric">Timezone: <span class="metric-value" id="timezone">--</span></p>
                </div>
            </div>
        </section>

        <section class="card">
            <h2>NTP Servers</h2>
            <div class="servers-grid" id="serversGrid">
                <p>Loading servers...</p>
            </div>
        </section>
    </main>

    <script>
        function toggleTheme() {
            const body = document.body;
            const current = body.getAttribute('data-theme');
            body.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
        }

        function updateAnalogClock(date) {
            const hours = date.getUTCHours();
            const minutes = date.getUTCMinutes();
            const seconds = date.getUTCSeconds();

            const hourDeg = (hours % 12) * 30 + minutes * 0.5;
            const minuteDeg = minutes * 6 + seconds * 0.1;
            const secondDeg = seconds * 6;

            document.getElementById('hourHand').style.transform = `rotate(${hourDeg}deg)`;
            document.getElementById('minuteHand').style.transform = `rotate(${minuteDeg}deg)`;
            document.getElementById('secondHand').style.transform = `rotate(${secondDeg}deg)`;
        }

        function updateDigitalTime() {
            const now = new Date();
            const utc = now.toISOString();
            
            document.getElementById('digitalTime').textContent = now.toLocaleTimeString('en-US', { hour12: false });
            document.getElementById('utcTime').textContent = 'UTC: ' + utc.split('.')[0] + 'Z';
            document.getElementById('localTime').textContent = 'Local: ' + now.toLocaleString();
            document.getElementById('epochTime').textContent = 'Epoch: ' + Math.floor(now.getTime() / 1000);
        }

        async function checkClientTime() {
            const start = performance.now();
            try {
                const response = await fetch('/api/time');
                const end = performance.now();
                const data = await response.json();
                
                const serverTime = new Date(data.utc).getTime();
                const clientTime = Date.now();
                const rtt = end - start;
                const offset = clientTime - serverTime - (rtt / 2);
                
                const offsetMs = Math.abs(offset).toFixed(2);
                document.getElementById('timeOffset').textContent = offsetMs + ' ms';
                document.getElementById('rttValue').textContent = rtt.toFixed(2) + ' ms';
                document.getElementById('timezone').textContent = Intl.DateTimeFormat().resolvedOptions().timeZone;

                const indicator = document.getElementById('syncIndicator');
                const status = document.getElementById('syncStatus');
                
                indicator.className = 'status-indicator';
                if (Math.abs(offset) < 50) {
                    indicator.classList.add('status-green');
                    status.textContent = 'Synchronized';
                } else if (Math.abs(offset) < 200) {
                    indicator.classList.add('status-yellow');
                    status.textContent = 'Minor drift';
                } else if (Math.abs(offset) < 500) {
                    indicator.classList.add('status-orange');
                    status.textContent = 'Significant drift';
                } else {
                    indicator.classList.add('status-red');
                    status.textContent = 'Out of sync';
                }
            } catch (e) {
                document.getElementById('syncStatus').textContent = 'Error checking time';
            }
        }

        async function loadServers() {
            try {
                const response = await fetch('/api/servers');
                const servers = await response.json();
                
                const grid = document.getElementById('serversGrid');
                if (servers.length === 0) {
                    grid.innerHTML = '<p>No servers configured</p>';
                    return;
                }

                grid.innerHTML = servers.map(s => {
                    let statusClass = s.reachable ? '' : 'unreachable';
                    let statusText = s.reachable ? 'Online' : 'Offline';
                    let statusBadge = s.reachable ? 'online' : 'offline';
                    
                    if (s.reachable && Math.abs(s.offset) > 20000000) {
                        statusClass = 'warning';
                        statusBadge = 'warning';
                    }

                    return `
                        <div class="server-card ${statusClass}">
                            <div class="server-header">
                                <span class="server-name">${s.name || s.address}</span>
                                <span class="server-status ${statusBadge}">${statusText}</span>
                            </div>
                            <div class="server-metrics">
                                <div class="metric">Offset: <span class="metric-value">${s.reachable ? (s.offset / 1000000).toFixed(2) + ' ms' : 'N/A'}</span></div>
                                <div class="metric">Delay: <span class="metric-value">${s.reachable ? (s.delay / 1000000).toFixed(2) + ' ms' : 'N/A'}</span></div>
                                <div class="metric">Stratum: <span class="metric-value">${s.stratum || 'N/A'}</span></div>
                                <div class="metric">Poll: <span class="metric-value">${s.poll_interval || 'N/A'}s</span></div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                document.getElementById('serversGrid').innerHTML = '<p>Error loading servers</p>';
            }
        }

        // Initial updates
        updateDigitalTime();
        updateAnalogClock(new Date());
        checkClientTime();
        loadServers();

        // Update intervals
        setInterval(() => {
            updateDigitalTime();
            updateAnalogClock(new Date());
        }, 1000);

        setInterval(checkClientTime, 5000);
        setInterval(loadServers, 10000);
    </script>
</body>
</html>
